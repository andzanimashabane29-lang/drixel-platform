services:
  - type: web
    name: drixel-platform-api-staging
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: REQUIRE_OIDC
        value: "true"
      - key: MANAGED_STAGING
        value: "true"
      - key: OIDC_ISSUER
        value: https://dev-4pc3eomoyq8oy6o4.us.auth0.com/
      - key: OIDC_AUDIENCE
        value: https://api.drixel-platform
      - key: OIDC_CLIENT_ID
        value: KfBDY5K8I1cqv3dG4g4DMXoRaYRUCK0n
      - key: OIDC_ALLOWED_CLIENT_IDS
        value: tpc_u54E49Xiadjqiui3V9FMwe
      - key: OIDC_JWKS_URI
        value: https://dev-4pc3eomoyq8oy6o4.us.auth0.com/.well-known/jwks.json
      - key: ADMIN_DATABASE_URL
        fromDatabase:
          name: drixel-platform-db-staging
          property: connectionString
      - key: DIRECTORY_DATABASE_URL
        fromDatabase:
          name: drixel-platform-db-staging
          property: connectionString
      - key: MANAGEMENT_DATABASE_URL
        fromDatabase:
          name: drixel-platform-db-staging
          property: connectionString
      - key: PGSSL
        value: require
      - key: PGSSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: PGPOOL_MAX
        value: "5"
      - key: PGCONNECT_TIMEOUT_MS
        value: "5000"
      - key: PGIDLE_TIMEOUT_MS
        value: "30000"

databases:
  - name: drixel-platform-db-staging
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: drixel_platform
    user: drixel_admin
    ipAllowList: []
