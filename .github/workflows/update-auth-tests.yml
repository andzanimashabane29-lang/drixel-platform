name: Update auth diagnostics tests

on:
  push:
    paths:
      - .github/workflows/update-auth-tests.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update auth diagnostic expectations
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/app.test.js')
          s = p.read_text()
          old = "assert.deepEqual(await response.json(), { error: 'Authentication required' })"
          count = s.count(old)
          assert count == 3, f'expected 3 old auth assertions, found {count}'
          s = s.replace(old, "assert.deepEqual(await response.json(), { error: 'Identity provider is not configured' })")
          p.write_text(s)
      - name: Verify API tests and build
        run: |
          npm ci
          npm run test:api
          npm run build
      - name: Commit updated tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app.test.js
          git commit -m "Update auth diagnostics test expectations"
          git push
