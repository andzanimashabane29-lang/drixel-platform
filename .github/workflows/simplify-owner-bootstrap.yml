name: Simplify owner bootstrap

on:
  push:
    paths:
      - .github/workflows/simplify-owner-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch secure owner bootstrap
        shell: python
        run: |
          from pathlib import Path

          # 1) Simplify provisioner to require only the explicit Auth0 subject.
          p = Path('scripts/provision-database.mjs')
          s = p.read_text()
          old = """async function bootstrapOwner(client) {\n  const email = process.env.OIDC_BOOTSTRAP_ADMIN_EMAIL\n  const name = process.env.OIDC_BOOTSTRAP_ADMIN_NAME\n  const issuer = process.env.OIDC_ISSUER\n  const subject = process.env.OIDC_BOOTSTRAP_ADMIN_SUBJECT\n  const provided = [email, name, issuer, subject].filter(Boolean).length\n\n  if (provided === 0) return\n  if (managedStaging && provided !== 4) {\n    console.warn('Skipping managed staging owner bootstrap because the bootstrap identity configuration is incomplete.')\n    return\n  }\n  if (provided !== 4) throw new Error('Set OIDC_BOOTSTRAP_ADMIN_EMAIL, OIDC_BOOTSTRAP_ADMIN_NAME, OIDC_ISSUER and OIDC_BOOTSTRAP_ADMIN_SUBJECT together')\n\n  await client.query(\"SELECT set_config('drixel.bootstrap_email', $1, false)\", [email])\n  await client.query(\"SELECT set_config('drixel.bootstrap_name', $1, false)\", [name])\n  await client.query(\"SELECT set_config('drixel.bootstrap_issuer', $1, false)\", [issuer])\n  await client.query(\"SELECT set_config('drixel.bootstrap_subject', $1, false)\", [subject])\n  await runFile(client, 'db/init/04_bootstrap_owner.sql')\n}\n"""
          new = """async function bootstrapOwner(client) {\n  const subject = process.env.OIDC_BOOTSTRAP_ADMIN_SUBJECT\n  if (!subject) return\n\n  const issuer = required('OIDC_ISSUER')\n  const name = process.env.OIDC_BOOTSTRAP_ADMIN_NAME || 'Drixel Labs Group Owner'\n  const email = process.env.OIDC_BOOTSTRAP_ADMIN_EMAIL || ''\n\n  await client.query(\"SELECT set_config('drixel.bootstrap_email', $1, false)\", [email])\n  await client.query(\"SELECT set_config('drixel.bootstrap_name', $1, false)\", [name])\n  await client.query(\"SELECT set_config('drixel.bootstrap_issuer', $1, false)\", [issuer])\n  await client.query(\"SELECT set_config('drixel.bootstrap_subject', $1, false)\", [subject])\n  await runFile(client, 'db/init/04_bootstrap_owner.sql')\n}\n"""
          assert old in s, 'bootstrapOwner block not found'
          p.write_text(s.replace(old, new, 1))

          # 2) Make email optional in the one-time bootstrap SQL.
          p = Path('db/init/04_bootstrap_owner.sql')
          s = p.read_text()
          s = s.replace(
            "bootstrap_email text := lower(btrim(current_setting('drixel.bootstrap_email')));",
            "bootstrap_email text := nullif(lower(btrim(current_setting('drixel.bootstrap_email', true))), '');"
          )
          old = """    IF EXISTS (SELECT 1 FROM drixel.account_emails WHERE normalized_email = bootstrap_email) THEN\n      RAISE EXCEPTION 'Bootstrap email already belongs to an account; verify and link its identity manually';\n    END IF;\n\n    INSERT INTO drixel.accounts (display_name) VALUES (bootstrap_name) RETURNING id INTO bootstrap_account_id;\n    INSERT INTO drixel.account_emails (account_id, email, is_verified, is_primary)\n      VALUES (bootstrap_account_id, bootstrap_email, true, true);\n    INSERT INTO drixel.account_identities (account_id, issuer, subject)\n      VALUES (bootstrap_account_id, bootstrap_issuer, bootstrap_subject);\n  ELSIF NOT EXISTS (\n    SELECT 1 FROM drixel.account_emails\n    WHERE account_emails.account_id = bootstrap_account_id\n      AND normalized_email = bootstrap_email AND is_verified\n  ) THEN\n    RAISE EXCEPTION 'Bootstrap identity is already linked to an account with a different or unverified email';\n  END IF;\n"""
          new = """    IF bootstrap_email IS NOT NULL AND EXISTS (SELECT 1 FROM drixel.account_emails WHERE normalized_email = bootstrap_email) THEN\n      RAISE EXCEPTION 'Bootstrap email already belongs to an account; verify and link its identity manually';\n    END IF;\n\n    INSERT INTO drixel.accounts (display_name) VALUES (bootstrap_name) RETURNING id INTO bootstrap_account_id;\n    IF bootstrap_email IS NOT NULL THEN\n      INSERT INTO drixel.account_emails (account_id, email, is_verified, is_primary)\n        VALUES (bootstrap_account_id, bootstrap_email, true, true);\n    END IF;\n    INSERT INTO drixel.account_identities (account_id, issuer, subject)\n      VALUES (bootstrap_account_id, bootstrap_issuer, bootstrap_subject);\n  ELSIF bootstrap_email IS NOT NULL AND NOT EXISTS (\n    SELECT 1 FROM drixel.account_emails\n    WHERE account_emails.account_id = bootstrap_account_id\n      AND normalized_email = bootstrap_email AND is_verified\n  ) THEN\n    RAISE EXCEPTION 'Bootstrap identity is already linked to an account with a different or unverified email';\n  END IF;\n"""
          assert old in s, 'bootstrap email block not found'
          p.write_text(s.replace(old, new, 1))

          # 3) Surface the authenticated Auth0 subject in Settings.
          p = Path('src/App.tsx')
          s = p.read_text()
          old = """          {section === 'Settings' && <SettingsPage businessCount={businesses.length} serviceCount={services.length} directoryConnected={!directoryLoading && !directoryError} />}\n"""
          new = """          {section === 'Settings' && <SettingsPage businessCount={businesses.length} serviceCount={services.length} directoryConnected={!directoryLoading && !directoryError} authSubject={idToken ? String(readJwtPayload(idToken).sub ?? '') : ''} />}\n"""
          assert old in s, 'SettingsPage call not found'
          s = s.replace(old, new, 1)

          old = """function SettingsPage({ businessCount, serviceCount, directoryConnected }: { businessCount: number; serviceCount: number; directoryConnected: boolean }) {\n  return <><PageHeading eyebrow=\"CONFIGURATION\" title=\"Settings\" description=\"Configure the shared identity and group directory services.\" /><section className=\"content-panel settings-section\"><div className=\"panel-heading\"><div><h2>Identity provider</h2><p>Single sign-on and account verification.</p></div><span className={`status-tag ${oidcConfigured ? '' : 'status-tag-muted'}`}>{oidcConfigured ? 'Configured' : 'Not connected'}</span></div><div className=\"settings-row\"><div><strong>Provider</strong><span>{oidcConfigured ? oidcConfig.issuer : 'Not configured'}</span></div><div><strong>Protocol</strong><span>OpenID Connect with PKCE</span></div><div><strong>Administrator MFA</strong><span>Enforce in the identity provider</span></div></div><div className=\"settings-note\">Configure the issuer, API audience, JWKS URI, public client ID, authorization endpoint, and token endpoint in the local environment. Register the exact callback URL shown in the README.</div></section>"""
          new = """function SettingsPage({ businessCount, serviceCount, directoryConnected, authSubject }: { businessCount: number; serviceCount: number; directoryConnected: boolean; authSubject: string }) {\n  return <><PageHeading eyebrow=\"CONFIGURATION\" title=\"Settings\" description=\"Configure the shared identity and group directory services.\" /><section className=\"content-panel settings-section\"><div className=\"panel-heading\"><div><h2>Identity provider</h2><p>Single sign-on and account verification.</p></div><span className={`status-tag ${oidcConfigured ? '' : 'status-tag-muted'}`}>{oidcConfigured ? 'Configured' : 'Not connected'}</span></div><div className=\"settings-row\"><div><strong>Provider</strong><span>{oidcConfigured ? oidcConfig.issuer : 'Not configured'}</span></div><div><strong>Protocol</strong><span>OpenID Connect with PKCE</span></div><div><strong>Administrator MFA</strong><span>Enforce in the identity provider</span></div></div>{authSubject && <div className=\"settings-note\"><strong>Auth0 User ID</strong><br /><code>{authSubject}</code><br />Use this value as <code>OIDC_BOOTSTRAP_ADMIN_SUBJECT</code> for the one-time first-owner bootstrap.</div>}<div className=\"settings-note\">Configure the issuer, API audience, JWKS URI, public client ID, authorization endpoint, and token endpoint in the local environment. Register the exact callback URL shown in the README.</div></section>"""
          assert old in s, 'SettingsPage definition not found'
          p.write_text(s.replace(old, new, 1))
      - name: Verify patch
        run: |
          npm ci
          npm run test:api
          npm run build
          node --check scripts/provision-database.mjs
      - name: Commit secure bootstrap simplification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/provision-database.mjs db/init/04_bootstrap_owner.sql src/App.tsx
          git commit -m "Simplify secure first-owner bootstrap"
          git push

# trigger: 1
