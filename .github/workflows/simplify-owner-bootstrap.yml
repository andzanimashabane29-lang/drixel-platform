name: Surface Auth0 subject

on:
  push:
    paths:
      - .github/workflows/simplify-owner-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Auth0 User ID in Settings
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = "          {section === 'Settings' && <SettingsPage businessCount={businesses.length} serviceCount={services.length} directoryConnected={!directoryLoading && !directoryError} />}"
          new = "          {section === 'Settings' && <SettingsPage businessCount={businesses.length} serviceCount={services.length} directoryConnected={!directoryLoading && !directoryError} authSubject={idToken ? String(readJwtPayload(idToken).sub ?? '') : ''} />}"
          assert old in s, 'SettingsPage call not found'
          s = s.replace(old, new, 1)
          old = "function SettingsPage({ businessCount, serviceCount, directoryConnected }: { businessCount: number; serviceCount: number; directoryConnected: boolean }) {"
          new = "function SettingsPage({ businessCount, serviceCount, directoryConnected, authSubject }: { businessCount: number; serviceCount: number; directoryConnected: boolean; authSubject: string }) {"
          assert old in s, 'SettingsPage signature not found'
          s = s.replace(old, new, 1)
          marker = '<div className="settings-note">Configure the issuer, API audience, JWKS URI, public client ID, authorization endpoint, and token endpoint in the local environment. Register the exact callback URL shown in the README.</div>'
          replacement = '{authSubject && <div className="settings-note"><strong>Auth0 User ID</strong><br /><code>{authSubject}</code><br />Copy this value for the one-time Group Owner setup.</div>}' + marker
          assert marker in s, 'Identity settings note not found'
          s = s.replace(marker, replacement, 1)
          p.write_text(s)
      - name: Verify frontend
        run: |
          npm ci
          npm run build
      - name: Commit Settings identity helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Show Auth0 user ID for secure owner bootstrap"
          git push

# trigger: 2
