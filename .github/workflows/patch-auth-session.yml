# One-shot session persistence migration v2
name: Patch auth session persistence

on:
  push:
    paths:
      - .github/workflows/patch-auth-session.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Persist Auth0 session tokens in sessionStorage
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = "  const [accessToken, setAccessToken] = useState<string>()\n  const [idToken, setIdToken] = useState<string>()"
          new = "  const [accessToken, setAccessToken] = useState<string | undefined>(() => sessionStorage.getItem('drixel-access-token') ?? undefined)\n  const [idToken, setIdToken] = useState<string | undefined>(() => sessionStorage.getItem('drixel-id-token') ?? undefined)"
          assert old in s, 'token state initializer not found'
          s = s.replace(old, new, 1)

          old = "        setAccessToken(tokens.access_token)\n        setIdToken(tokens.id_token)\n        setAuthError('')"
          new = "        setAccessToken(tokens.access_token)\n        setIdToken(tokens.id_token)\n        sessionStorage.setItem('drixel-access-token', tokens.access_token)\n        sessionStorage.setItem('drixel-id-token', tokens.id_token)\n        setAuthError('')"
          assert old in s, 'token callback assignment not found'
          s = s.replace(old, new, 1)

          old = "                if (accessToken) { setAccessToken(undefined); setIdToken(undefined); setAuthError(''); return }"
          new = "                if (accessToken) {\n                  setAccessToken(undefined)\n                  setIdToken(undefined)\n                  sessionStorage.removeItem('drixel-access-token')\n                  sessionStorage.removeItem('drixel-id-token')\n                  setAuthError('')\n                  return\n                }"
          assert old in s, 'sign-out handler not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Verify frontend
        run: |
          npm ci
          npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Persist authenticated session across page refreshes"
          git push
