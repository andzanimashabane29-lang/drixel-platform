name: Apply final admin refactor

on:
  push:
    paths:
      - 'scripts/refactor-admin-final.mjs'
      - '.github/workflows/apply-admin-final-refactor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/refactor-admin-final.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/admin/AdminShell.tsx
          git diff --cached --quiet || git commit -m "Complete premium admin redesign"
          git push
