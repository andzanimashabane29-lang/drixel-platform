# trigger v2
name: Fix staging RLS migration

on:
  push:
    paths:
      - .github/workflows/fix-staging-rls.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move RLS disable before role seed
        shell: python
        run: |
          from pathlib import Path
          p = Path('db/migrations/005_staging_identity.sql')
          s = p.read_text()
          block = """ALTER TABLE drixel.accounts DISABLE ROW LEVEL SECURITY;
ALTER TABLE drixel.account_identities DISABLE ROW LEVEL SECURITY;
ALTER TABLE drixel.account_emails DISABLE ROW LEVEL SECURITY;
ALTER TABLE drixel.organization_memberships DISABLE ROW LEVEL SECURITY;
ALTER TABLE drixel.application_memberships DISABLE ROW LEVEL SECURITY;
ALTER TABLE drixel.roles DISABLE ROW LEVEL SECURITY;
ALTER TABLE drixel.role_assignments DISABLE ROW LEVEL SECURITY;
ALTER TABLE drixel.audit_events DISABLE ROW LEVEL SECURITY;
ALTER TABLE drixel.invitations DISABLE ROW LEVEL SECURITY;
"""
          assert s.count(block) == 1, 'expected one RLS disable block'
          s = s.replace(block, '', 1)
          marker = "INSERT INTO drixel.roles (scope, code, display_name, description) VALUES"
          assert marker in s, 'role seed marker not found'
          s = s.replace(marker, block + "\n" + marker, 1)
          p.write_text(s)
      - name: Verify migration ordering
        run: |
          node --check scripts/provision-database.mjs
          npm ci
          npm run test:api
          npm run build
      - name: Commit migration fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/migrations/005_staging_identity.sql
          git commit -m "Fix staging identity RLS seed ordering"
          git push
