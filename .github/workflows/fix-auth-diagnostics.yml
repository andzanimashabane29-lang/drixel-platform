name: Fix auth diagnostics

on:
  push:
    paths:
      - .github/workflows/fix-auth-diagnostics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch authentication diagnostics and Auth0 client ID
        shell: python
        run: |
          from pathlib import Path

          app = Path('server/app.js')
          s = app.read_text()
          old = "catch { return sendJson(response, 401, { error: 'Authentication required' }) }"
          new = "catch (error) { return sendJson(response, 401, { error: error instanceof AuthenticationError ? error.message : 'Authentication required' }) }"
          count = s.count(old)
          assert count > 0, 'authentication catch pattern not found'
          s = s.replace(old, new)
          app.write_text(s)
          print(f'Updated {count} authentication failure handlers')

          render = Path('render.yaml')
          r = render.read_text()
          wrong = 'KfBDY5K8I1cqv3dG4g4DMXoRaYRUCkOn'
          correct = 'KfBDY5K8I1cqv3dG4g4DMXoRaYRUCK0n'
          assert wrong in r or correct in r, 'Auth0 client ID not found'
          r = r.replace(wrong, correct)
          render.write_text(r)
      - name: Verify platform
        run: |
          npm ci
          npm run build
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app.js render.yaml
          git commit -m "Expose OIDC auth failures and correct Auth0 client ID"
          git push
