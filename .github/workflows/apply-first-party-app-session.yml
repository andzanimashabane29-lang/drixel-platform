name: Apply first-party Drixel app session

on:
  push:
    paths:
      - 'scripts/add-first-party-app-session.mjs'
      - '.github/workflows/apply-first-party-app-session.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/add-first-party-app-session.mjs
      - run: npm ci
      - run: npm run test:api
      - run: npm run build
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app.js server/app.test.js server/index.js server/oidc.js server/oidc.test.js
          git diff --cached --quiet || git commit -m "Add first-party Drixel app session endpoint"
          git push
