name: Apply premium shell

on:
  push:
    branches: [main]
    paths:
      - scripts/refactor-premium-shell.mjs

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/refactor-premium-shell.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Refactor admin shell to premium components"
          git push
