name: Apply system shortcuts and status refinement

on:
  push:
    paths:
      - 'scripts/refine-system-status-shortcuts.mjs'
      - '.github/workflows/apply-system-shortcuts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/refine-system-status-shortcuts.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/admin/AdminShell.tsx
          git diff --cached --quiet || git commit -m "Refine system status and keyboard navigation"
          git push
