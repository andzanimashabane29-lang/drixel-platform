name: Rebuild product UI

on:
  push:
    paths:
      - .github/workflows/rebuild-product-ui.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bundle UI font and correct product system
        shell: bash
        run: |
          npm install @fontsource-variable/roboto-flex@latest --save
          python <<'PY'
          from pathlib import Path
          p = Path('src/product-system.css')
          s = p.read_text()
          s = s.replace("@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap');\n\n", "")
          s = s.replace('font-family: "Roboto", "Noto Sans", Arial, sans-serif !important;', 'font-family: "Roboto Flex", "Noto Sans", Arial, sans-serif !important;')
          fixes = r'''

/* Product UI correction pass — fixes live implementation defects, not a second theme. */
body:not(.ecosystem-page) .visually-hidden {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

body:not(.ecosystem-page) .topbar {
  display: grid !important;
  grid-template-columns: minmax(0, 1fr) auto !important;
  align-items: center !important;
  overflow: visible !important;
}
body:not(.ecosystem-page) .topbar-actions {
  min-width: 0 !important;
  display: flex !important;
  align-items: center !important;
  justify-content: flex-end !important;
}
body:not(.ecosystem-page) .search-field {
  flex: 0 1 260px !important;
  width: 260px !important;
  max-width: 32vw !important;
  overflow: hidden !important;
}
body:not(.ecosystem-page) .search-field input {
  width: 100% !important;
  min-width: 0 !important;
  border: 0 !important;
  box-shadow: none !important;
  background: transparent !important;
}
body:not(.ecosystem-page) .user-control {
  flex: 0 0 auto !important;
  min-width: max-content !important;
}

body:not(.ecosystem-page) .portfolio-management .data-table td {
  position: relative !important;
}
body:not(.ecosystem-page) .portfolio-row-input,
body:not(.ecosystem-page) .portfolio-row-select {
  display: block !important;
  width: 100% !important;
  min-width: 0 !important;
  max-width: 100% !important;
}
body:not(.ecosystem-page) .portfolio-management .data-table td:nth-child(3) .button {
  min-width: 110px !important;
}

body:not(.ecosystem-page) .directory-pagination {
  min-height: 72px !important;
  padding: 14px 16px !important;
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  gap: 18px !important;
  background: #fff !important;
}
body:not(.ecosystem-page) .directory-pagination > p {
  margin: 0 !important;
  color: var(--ui-tertiary) !important;
  font-size: 10.5px !important;
}
body:not(.ecosystem-page) .pagination-actions {
  display: flex !important;
  align-items: center !important;
  gap: 8px !important;
  margin-left: auto !important;
}
body:not(.ecosystem-page) .pagination-actions > span {
  min-width: 62px !important;
  text-align: center !important;
  color: var(--ui-tertiary) !important;
  font-size: 10px !important;
}
body:not(.ecosystem-page) .page-size-control {
  display: inline-flex !important;
  align-items: center !important;
  gap: 8px !important;
  white-space: nowrap !important;
}
body:not(.ecosystem-page) .page-size-control select {
  width: 64px !important;
  min-width: 64px !important;
}
body:not(.ecosystem-page) .directory-pagination .button {
  min-width: 76px !important;
  min-height: 34px !important;
  background: #f5f5f7 !important;
  border: 1px solid var(--ui-border) !important;
  color: var(--ui-text) !important;
  border-radius: 9px !important;
}
body:not(.ecosystem-page) .directory-pagination .button:not(:disabled):hover {
  background: #ececef !important;
}
body:not(.ecosystem-page) .directory-pagination .button:disabled {
  opacity: .38 !important;
}

body:not(.ecosystem-page) .settings-section .panel-heading {
  min-height: 68px !important;
}
body:not(.ecosystem-page) .settings-row {
  background: #fff !important;
}
body:not(.ecosystem-page) .settings-note {
  display: block !important;
  background: #f8f8fa !important;
}

body:not(.ecosystem-page) select {
  cursor: pointer !important;
}
body:not(.ecosystem-page) .portfolio-row-select,
body:not(.ecosystem-page) .directory-toolbar select,
body:not(.ecosystem-page) .page-size-control select {
  appearance: none !important;
  -webkit-appearance: none !important;
}

@media (max-width: 900px) {
  body:not(.ecosystem-page) .search-field { max-width: 220px !important; }
  body:not(.ecosystem-page) .directory-pagination { align-items: flex-start !important; flex-wrap: wrap !important; }
  body:not(.ecosystem-page) .pagination-actions { margin-left: 0 !important; }
}
'''
          marker = '/* Product UI correction pass — fixes live implementation defects, not a second theme. */'
          if marker in s:
              s = s.split(marker)[0].rstrip() + '\n\n' + fixes.lstrip()
          else:
              s = s.rstrip() + '\n' + fixes
          p.write_text(s)

          main = Path('src/main.tsx')
          t = main.read_text()
          if "@fontsource-variable/roboto-flex" not in t:
              t = t.replace("import ReactDOM from 'react-dom/client'\n", "import ReactDOM from 'react-dom/client'\nimport '@fontsource-variable/roboto-flex'\n")
          main.write_text(t)
          PY
      - name: Verify product UI
        run: |
          npm run build
          npm run test:api
      - name: Commit product UI rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/main.tsx src/product-system.css
          git commit -m "Rebuild admin product UI implementation"
          git push
