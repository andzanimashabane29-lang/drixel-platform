services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drixel_platform}
      POSTGRES_USER: ${POSTGRES_USER:-drixel_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - drixel_postgres:/var/lib/postgresql/data
      - ./db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/01_initial.sql:ro
      - ./db/seed/001_portfolio.sql:/docker-entrypoint-initdb.d/02_portfolio.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drixel_app} -d ${POSTGRES_DB:-drixel_platform}"]
      interval: 5s
      timeout: 3s
      retries: 15

  directory_init:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-drixel_platform}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-drixel_admin}
      POSTGRES_DB: ${POSTGRES_DB:-drixel_platform}
      POSTGRES_DIRECTORY_PASSWORD: ${POSTGRES_DIRECTORY_PASSWORD:?Set POSTGRES_DIRECTORY_PASSWORD in .env}
    volumes:
      - ./db/migrations/002_directory_reader.sql:/opt/drixel/002_directory_reader.sql:ro
      - ./db/init/03_directory_reader_login.sh:/opt/drixel/03_directory_reader_login.sh:ro
    entrypoint: ["/bin/sh", "/opt/drixel/03_directory_reader_login.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      API_PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-drixel_platform}
      PGUSER: drixel_directory_reader
      PGPASSWORD: ${POSTGRES_DIRECTORY_PASSWORD:?Set POSTGRES_DIRECTORY_PASSWORD in .env}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      directory_init:
        condition: service_completed_successfully

volumes:
  drixel_postgres:
